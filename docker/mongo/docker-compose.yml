version: '3.8'
services:
  # 配置服务器副本集 (3节点)
  configsvr1:
    image: mongo:8.0
    command: mongod --configsvr --replSet configReplSet --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - configsvr1:/data/configdb
    networks:
      - mongo-cluster

  configsvr2:
    image: mongo:8.0
    command: mongod --configsvr --replSet configReplSet --bind_ip_all
    volumes:
      - configsvr2:/data/configdb
    networks:
      - mongo-cluster

  configsvr3:
    image: mongo:8.0
    command: mongod --configsvr --replSet configReplSet --bind_ip_all
    volumes:
      - configsvr3:/data/configdb
    networks:
      - mongo-cluster

  # 分片1 (单节点副本集)
  shard1:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard1 --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - shard1:/data/db
    networks:
      - mongo-cluster

  # 分片2 (单节点副本集)
  shard2:
    image: mongo:8.0
    command: mongod --shardsvr --replSet shard2 --bind_ip_all
    volumes:
      - shard2:/data/db
    networks:
      - mongo-cluster

  # Mongos 路由
  mongos:
    image: mongo:8.0
    command: mongos --configdb configReplSet/configsvr1:27019,configsvr2:27019,configsvr3:27019 --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
    networks:
      - mongo-cluster

volumes:
  configsvr1:
  configsvr2:
  configsvr3:
  shard1:
  shard2:

networks:
  mongo-cluster:
    driver: bridge

# 初始化脚本 (需要手动执行或通过额外服务自动化)
